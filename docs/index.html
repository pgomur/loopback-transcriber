<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LoopbackTranscriber</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('docs-language'); } catch (e) { }
      var browser = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      var language = saved === 'es' || saved === 'en' ? saved : (/^es\b/i.test(browser) ? 'es' : 'en');
      location.replace(language + '/');
    })();
  </script>
  <meta http-equiv="refresh" content="1; url=en/">
</head>
<body>
  <p><a href="en/">English</a> · <a href="es/">Español</a></p>
</body>
</html>
